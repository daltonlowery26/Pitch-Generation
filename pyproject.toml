[project]
name = "optimalpitch"
version = "0.1.0"
description = "Optimal Pitch Selection"
requires-python = ">=3.13"
dependencies = [
    "flax>=0.12.7",
    "grain>=0.2.18",
    "jax>=0.10.2",
    "numpy>=2.5.1",
    "numpyro>=0.21.0",
    "polars>=1.42.1",
    "pyarrow>=25.0.0",
    "pybaseball>=2.2.7",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "umap-learn>=0.5.0",
    "visidata>=3.4",
]

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["DTZ001"]